{% extends "base.html" %}

{% block contenido %}
    <h1>Registro</h1>

    {% with mensajes = get_flashed_menssages(with_categories=true) %}
        {% if mansajes %}
            <ul>
                {% for categoria, texto in mensajes %}
                <li><strong>{{ categoria }}:</strong>{{ texto }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ datos.get('nombre', '') }}">

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" value="{{ datos.get('edad', '') }}">

        <button type="submit">Enviar</button>
    </form>
{% endblock %}
