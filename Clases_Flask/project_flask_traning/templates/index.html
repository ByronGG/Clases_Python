<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludos</title>
</head>
<body>
    <h1>Hola, {{ nombre }}</h1>
    {% if edad >= 18 %}
        <p>Eres mayor de edad</p>
    {% else %}
        <p>Eres menor de edad</p>
    {% endif %}
    <ul>
        {% for i in range(10) %}
            <li>Elementos {{ i }}</li>
        {% endfor %}
    </ul>
</body>
</html>
